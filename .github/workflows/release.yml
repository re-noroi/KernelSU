name: Release

# Manual only. Pushing to a branch builds artifacts but never publishes a release;
# run this workflow (Actions -> Release -> Run workflow) to cut a release.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    permissions:
      contents: read
    secrets: inherit

  release:
    needs: [build-manager]
    if: needs.build-manager.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Collect LKM and manager APK
        run: |
          mkdir -p lkm manager
          # LKM artifacts are named "<variant>-<kmi>-lkm", e.g. aarch64-android14-6.1-lkm
          # or xx-android14-6.1-lkm, each holding "<kmi>_kernelsu.ko".
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Collect $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls "$dir"/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

          # Only the repacked artifact may be published. manager-gradle-no-ksud also
          # contains an APK, but it has no libksud.so and cannot run ksud, so never
          # let it win this lookup.
          APK=$(find . -maxdepth 2 -type f -name "*.apk" \
                  -not -path "./manager-gradle-no-ksud/*" \
                  -not -path "./manager/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No repacked manager APK found in downloaded artifacts"
            exit 1
          fi
          case "$APK" in
            *repack*|*noroiSU*) ;;
            *)
              echo "::error::Refusing to publish unexpected APK path: $APK"
              exit 1
              ;;
          esac
          mv "$APK" manager/

      - name: Display structure of release files
        run: |
          ls -l manager lkm ksud ksuinit

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-manager.outputs.release_tag }}
          name: noroiSU ${{ needs.build-manager.outputs.build_ver }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          files: |
            manager/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
